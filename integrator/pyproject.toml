[project]
name = "ac_integrator"
version = "2026.0"
description = "Numerical integrator for CosmoGW"
authors = [
    { name = "Touko Puro", email = "puro.touko@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.0"

[project.urls]
homepage = "https://bitbucket.org/jpekkila/astaroth"

[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.args = [
  "-DCMAKE_BUILD_TYPE=Release",
  "-DALLOW_DEAD_VARIABLES=ON",
  "-DBUILD_SAMPLES=OFF",
  "-DBUILD_STANDALONE=OFF",
  "-DDSL_MODULE_FILE=solver.ac",
  "-DBUILD_INTEGRATOR=ON",
]
cmake.source-dir = ".."
ninja.make-fallback = true
wheel.py-api = "cp312"
wheel.packages = ["python/ac_integrator"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "./**/*.{h,c,hpp,cpp,cc,cu,cuh,ac}" },
    { file = "./**/CMakeLists.txt" },
]

[tool.uv.workspace]
