name: Build and test all build configurations

on:
  push:
    branches:
      - develop

jobs:
  define-matrices:
    runs-on: ubuntu-slim
    outputs:
      test-builds-matrix: ${{ steps.matrices.outputs.test-builds-matrix }}
      test-matrix: ${{ steps.matrices.outputs.test-matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Define matrices
        id: matrices
        run: |
          echo "test-builds-matrix=$(find ./test-builds -mindepth 1 -maxdepth 1 -type d  | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          echo "test-matrix=$(find ./test -mindepth 1 -maxdepth 1 -type d | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  compile-base-builds-ubuntu:
    runs-on: ubuntu-latest
    container:
      image: &ubuntu-container nvidia/cuda:13.3.0-devel-ubuntu26.04
    needs: define-matrices
    strategy:
      matrix:
        build-configuration-dir: ${{ fromJSON(needs.define-matrices.outputs.test-builds-matrix) }}
    timeout-minutes: 180

    steps: &build-and-test-steps
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Ubuntu dependencies
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/install-apt-packages
        with:
          packages: cmake libgsl-dev flex bison openmpi-bin libopenmpi-dev gfortran git python3 python3-numpy python3-pandas

      - name: Install macOS dependencies
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install cmake gsl open-mpi bison flex python3
          # Makes mac to use the Bison 3.*
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          # Since Python 3.11 installing packages globally is not permitted by default (see PEP 668).
          python3 -m pip config set global.break-system-packages true
          python3 -m pip install pandas numpy

      - name: Force CPU build on macOS
        if: ${{ runner.os == 'macOS' }}
        run: echo AC_CPU_BUILD=ON >> "$GITHUB_ENV"

      - name: Start SSH agent and add key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CI_CD_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Compile builds and run tests
        uses: ./.github/actions/build-test-astaroth
        with:
          build-configuration-dir: $GITHUB_WORKSPACE/${{ matrix.build-configuration-dir }}

  compile-and-run-tests-ubuntu:
    runs-on: ubuntu-latest
    container:
      image: *ubuntu-container
    needs:
      - define-matrices
      - compile-base-builds-ubuntu
    strategy:
      matrix:
        build-configuration-dir: ${{ fromJSON(needs.define-matrices.outputs.test-matrix) }}
    timeout-minutes: 180

    steps: *build-and-test-steps

  compile-base-builds-macos:
    runs-on: macos-latest
    needs: define-matrices
    strategy:
      matrix:
        build-configuration-dir: ${{ fromJSON(needs.define-matrices.outputs.test-builds-matrix) }}
    timeout-minutes: 180

    steps: *build-and-test-steps

  compile-and-run-tests-macos:
    runs-on: macos-latest
    needs:
      - define-matrices
      - compile-base-builds-macos
    strategy:
      matrix:
        build-configuration-dir: ${{ fromJSON(needs.define-matrices.outputs.test-matrix) }}
    timeout-minutes: 180

    steps: *build-and-test-steps
