name: 'Build and test an Astaroth build'
description: 'Builds and tests an Astaroth build using scripts in the given build configuration.'

inputs:
  build-configuration-dir:
    description: 'Path to a directory with an Astaroth build and test configuration.'
    required: true
  cpu-build:
    description: 'Run the build with AC_CPU_BUILD=ON to force not using CUDA or HIP. Use either ON or OFF.'
    required: false
    default: 'OFF'

runs:
  using: "composite"

  steps:
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        key: ${{ runner.os }}-${{ github.job }}-${{ inputs.build-configuration-dir }}
        max-size: 50MB

    - name: Run build.sh script
      shell: bash
      run: |
        if [ -f "$GITHUB_WORKSPACE/${{ inputs.build-configuration-dir }}/build.sh" ]; then
          source sourceme.sh
          cd $GITHUB_WORKSPACE/${{ inputs.build-configuration-dir }}
          ./build.sh
        fi
      env:
        OMPI_ALLOW_RUN_AS_ROOT: 1
        OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
        AC_CPU_BUILD: ${{ inputs.cpu-build }}

    - name: Run build.sh script (CPU-only build)
      shell: bash
      if: ${{ inputs.cpu-build == 'OFF' }}
      run: |
        if [ -f "$GITHUB_WORKSPACE/${{ inputs.build-configuration-dir }}/build.sh" ]; then
          source sourceme.sh
          cd $GITHUB_WORKSPACE/${{ inputs.build-configuration-dir }}
          ./build.sh
        fi
      env:
        OMPI_ALLOW_RUN_AS_ROOT: 1
        OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
        AC_CPU_BUILD: 'ON'

    - name: Run run.sh script (if present)
      id: test
      # OM: This is here temporarily until we resolve the problem with test
      # results diverging across platforms. Likely to be caused by random
      # number generators producing different values across C compilers and
      # platforms.
      if: ${{ runner.os != 'macOS' }}
      shell: bash
      run: |
        if [ -f "$GITHUB_WORKSPACE/${{ inputs.build-configuration-dir }}/run.sh" ]; then
          source sourceme.sh
          cd $GITHUB_WORKSPACE/${{ inputs.build-configuration-dir }}
          ./run.sh
        fi
      env:
        OMPI_ALLOW_RUN_AS_ROOT: 1
        OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

    - name: Upload runtime compilation log
      uses: actions/upload-artifact@v7
      if: ${{ failure() && steps.test.conclusion == 'failure' }}
      with:
        path: "${{ github.workspace }}/${{ inputs.build-configuration-dir }}/ac_compilation_log"
        archive: false
        if-no-files-found: error
